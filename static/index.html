<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinica</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <div class="Container">
            <h1>Clinica</h1>
            <p>Bem-vindo à nossa clínica! Aqui você encontrará informações sobre nossos serviços, equipe e agendamentos de consulta.</p>
            <h2>Agendar consulta</h2>
            <p>Escolha a data e o horário para sua consulta.</p>
            <input type="date" id="data">
            <button id="btn-buscar">Ver horários disponíveis</button>
            <div id="horarios"></div>
            <input type="text" id="nome" placeholder="Seu nome">
            <input type="text" id="telefone" placeholder="Contato(opcional)">
            <button id="agendar">Agendar</button>
            <p>Horário de funcionamento: Segunda a Sexta, das 8h às 18h sem fechar ao meio dia.</p>
            <script src="script.js"></script>
        </div>
    </body>
</html>
